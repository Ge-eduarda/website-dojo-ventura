name: CI HTML Estático Dojo Ventura (validar; deploy manual)

# Site estático puro em website/ (HTML + DaisyUI via CDN, sem build).
# MODO ATUAL: só validação (lint HTML + links internos) a cada push.
# Deploy DESATIVADO — só roda via disparo manual (Actions → Run workflow → deploy: true).
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Fazer deploy no Cloudflare Pages? (padrão: não)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint HTML + Links Internos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML (htmlhint)
        run: npx --yes htmlhint "website/**/*.html"

      - name: Checar links internos e âncoras
        run: python3 tools/check-links.py website

      - name: Deploy no Cloudflare Pages (MANUAL — desativado)
        # Para ativar o deploy: vá em Actions → CI HTML Estático → Run workflow
        # e marque a opção "deploy". Sem isso, o CI só valida.
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy website --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --commit-hash=${{ github.sha }}
