name: CI Astro Dojo Ventura (validar; deploy manual)

# GitHub só executa workflows em .github/workflows/ NA RAIZ do repo.
# O código Astro mora em website/ → tudo roda com working-directory: website.
# MODO ATUAL: só validação (check + build) a cada push. Deploy DESATIVADO —
# o step de deploy só roda via disparo manual (Actions → Run workflow).
on:
  push:
    branches:
      - main
      - staging
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Fazer deploy no Cloudflare Pages? (padrão: não)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  build-and-test:
    name: Validação & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Checagem de Tipos e Sintaxe Astro
        run: npx astro check

      - name: Build de Produção
        run: npm run build

      - name: Deploy no Cloudflare Pages (MANUAL — desativado)
        # Para ativar o deploy: vá em Actions → CI Astro Dojo Ventura → Run workflow
        # e marque a opção "deploy". Sem isso, o CI só valida (check + build).
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          command: pages deploy ./dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME }} --commit-hash=${{ github.sha }}
